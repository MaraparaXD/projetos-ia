name: TramontoSec tests

on:
  push:
    paths: ['agents/tramontosec-ai/**', '.github/workflows/tramontosec-tests.yml']
  pull_request:
    paths: ['agents/tramontosec-ai/**', '.github/workflows/tramontosec-tests.yml']

permissions:
  contents: read

concurrency:
  group: tramontosec-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: agents/tramontosec-ai
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Offline unit and integration tests
        run: python -m unittest discover -s tests -v

  lint:
    name: Ruff lint on Ubuntu Python 3.13
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents/tramontosec-ai
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install development tools
        run: python -m pip install -e ".[dev]"
      - name: Ruff static lint
        run: ruff check .

  coverage:
    name: Coverage on Ubuntu Python 3.13
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents/tramontosec-ai
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install development tools
        run: python -m pip install -e ".[dev]"
      - name: Report test coverage
        run: |
          coverage run -m unittest discover -s tests
          coverage report

  smoke:
    name: Demo sintética CLI on Ubuntu Python 3.13
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents/tramontosec-ai
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Executar fluxo de demonstração offline
        env:
          TRAMONTO_WS: ${{ runner.temp }}/tramonto-smoke
        run: |
          python -m tramontosec --workspace "$TRAMONTO_WS" demo --ack-synthetic-review
          python -m tramontosec --workspace "$TRAMONTO_WS" audit --project aurora-demo
          python -m tramontosec --workspace "$TRAMONTO_WS" report --project aurora-demo
