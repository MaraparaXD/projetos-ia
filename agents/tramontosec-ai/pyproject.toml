[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tramontosec-ai"
version = "0.4.0"
description = "Auditoria local pelo Tramonto com três especialistas e revisão humana"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=6,<7"]
dev = ["ruff>=0.14,<0.16", "coverage>=7.10,<8"]

[project.scripts]
tramontosec = "tramontosec.cli:main"

[tool.setuptools.packages.find]
include = ["tramontosec*"]

[tool.setuptools.package-data]
tramontosec = ["web/*.html", "web/*.css", "web/*.js"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E9", "F"]
